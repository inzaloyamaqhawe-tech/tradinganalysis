<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TradingAnalysis Admin</title>
<style>
  body { margin:0; background:#0b0f14; color:#e8edf5; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; padding:24px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size:1.3rem; }
  input, button { padding:10px 12px; border-radius:8px; border:1px solid #232c3a; background:#0e141c; color:#e8edf5; font-size:.9rem; }
  button { background:#4f8cff; border:none; font-weight:600; cursor:pointer; }
  button.danger { background:#ff5c6c; }
  table { width:100%; border-collapse: collapse; margin-top:16px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #232c3a; font-size:.85rem; }
  .status-active { color:#33d17a; font-weight:600; }
  .status-pending { color:#ffb84f; font-weight:600; }
  .status-inactive { color:#8a96a8; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .top { display:flex; gap:8px; align-items:center; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 TradingAnalysis — Admin</h1>
  <div class="top">
    <input type="password" id="adminKey" placeholder="Admin key" style="flex:1;" />
    <button id="loadBtn">Load subscribers</button>
  </div>
  <div class="row">
    <input type="email" id="quickEmail" placeholder="email to activate" style="flex:1;" />
    <input type="number" id="quickDays" placeholder="days" value="30" style="width:80px;" />
    <button id="activateBtn">Activate</button>
  </div>
  <table>
    <thead><tr><th>Email</th><th>Status</th><th>Expires</th><th>Action</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
  const keyInput = document.getElementById('adminKey');
  keyInput.value = localStorage.getItem('ta_admin_key') || '';

  async function api(path, opts = {}) {
    const key = keyInput.value.trim();
    localStorage.setItem('ta_admin_key', key);
    const res = await fetch(path, {
      ...opts,
      headers: { 'Content-Type': 'application/json', 'x-admin-key': key, ...(opts.headers || {}) },
    });
    return res.json();
  }

  async function load() {
    const data = await api('/api/admin/subscribers');
    const rows = document.getElementById('rows');
    if (!data.subscribers) { rows.innerHTML = `<tr><td colspan="4">${data.error || 'error'}</td></tr>`; return; }
    rows.innerHTML = data.subscribers.map(s => `
      <tr>
        <td>${s.email}</td>
        <td class="status-${s.status}">${s.status}</td>
        <td>${s.expires_at ? new Date(s.expires_at).toLocaleDateString() : '—'}</td>
        <td>
          <button data-email="${s.email}" class="act">Activate 30d</button>
          <button data-email="${s.email}" class="danger deact">Deactivate</button>
        </td>
      </tr>
    `).join('');
    document.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => activate(b.dataset.email, 30)));
    document.querySelectorAll('.deact').forEach(b => b.addEventListener('click', () => deactivate(b.dataset.email)));
  }

  async function activate(email, days) {
    await api('/api/admin/activate', { method: 'POST', body: JSON.stringify({ email, days }) });
    load();
  }
  async function deactivate(email) {
    await api('/api/admin/deactivate', { method: 'POST', body: JSON.stringify({ email }) });
    load();
  }

  document.getElementById('loadBtn').addEventListener('click', load);
  document.getElementById('activateBtn').addEventListener('click', () => {
    const email = document.getElementById('quickEmail').value.trim();
    const days = Number(document.getElementById('quickDays').value || 30);
    if (email) activate(email, days);
  });
</script>
</body>
</html>
