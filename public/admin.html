<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TradingAnalysis Admin</title>
<link rel="stylesheet" href="css/styles.css" />
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: .87rem; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
  .status-active { color: var(--up); font-weight: 700; }
  .status-pending { color: var(--gold); font-weight: 700; }
  .status-inactive { color: var(--muted); }
  button.danger { background: linear-gradient(135deg, #ff5d6c, #c23345); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">📈</span>
      <span class="brand-name">Trading<b>Analysis</b></span>
    </a>
    <nav class="mainnav">
      <a class="mainnav-item" href="index.html" style="display:flex; align-items:center;">← Back to site</a>
    </nav>
    <div class="topbar-cta"><span class="status-pill">ADMIN</span></div>
  </div>
</header>

<main class="shell">
  <h1>Subscribers</h1>
  <p class="section-sub">Activate a subscriber after you've confirmed their PayPal payment.</p>

  <div class="panel">
    <div class="row">
      <input type="password" id="adminKey" placeholder="Admin key" />
      <button id="loadBtn">Load subscribers</button>
    </div>
    <div class="row" style="margin-top:14px; border-top:1px solid var(--border); padding-top:14px;">
      <input type="email" id="quickEmail" placeholder="email to activate" />
      <input type="number" id="quickDays" placeholder="days" value="30" style="max-width:100px; min-width:100px;" />
      <button id="activateBtn">Activate</button>
    </div>
  </div>

  <div class="panel">
    <table>
      <thead><tr><th>Email</th><th>Status</th><th>Expires</th><th>Action</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<footer class="footer"><div class="footer-inner"><div><strong>TradingAnalysis</strong> Admin</div></div></footer>

<script>
  const keyInput = document.getElementById('adminKey');
  keyInput.value = localStorage.getItem('ta_admin_key') || '';

  async function api(path, opts = {}) {
    const key = keyInput.value.trim();
    localStorage.setItem('ta_admin_key', key);
    const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': key, ...(opts.headers || {}) } });
    return res.json();
  }

  async function load() {
    const data = await api('/api/admin/subscribers');
    const rows = document.getElementById('rows');
    if (!data.subscribers) { rows.innerHTML = `<tr><td colspan="4">${data.error || 'error'}</td></tr>`; return; }
    rows.innerHTML = data.subscribers.map(s => `
      <tr>
        <td>${s.email}</td>
        <td class="status-${s.status}">${s.status}</td>
        <td>${s.expires_at ? new Date(s.expires_at).toLocaleDateString() : '—'}</td>
        <td>
          <button data-email="${s.email}" class="act">Activate 30d</button>
          <button data-email="${s.email}" class="danger deact">Deactivate</button>
        </td>
      </tr>
    `).join('');
    document.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => activate(b.dataset.email, 30)));
    document.querySelectorAll('.deact').forEach(b => b.addEventListener('click', () => deactivate(b.dataset.email)));
  }

  async function activate(email, days) { await api('/api/admin/activate', { method: 'POST', body: JSON.stringify({ email, days }) }); load(); }
  async function deactivate(email) { await api('/api/admin/deactivate', { method: 'POST', body: JSON.stringify({ email }) }); load(); }

  document.getElementById('loadBtn').addEventListener('click', load);
  document.getElementById('activateBtn').addEventListener('click', () => {
    const email = document.getElementById('quickEmail').value.trim();
    const days = Number(document.getElementById('quickDays').value || 30);
    if (email) activate(email, days);
  });
</script>
</body>
</html>
